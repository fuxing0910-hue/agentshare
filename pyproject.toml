[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshare"
version = "0.2.0"
description = "Review and selectively export AI coding transcripts locally."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fu Xing"}]
dependencies = []
keywords = ["agent-skills", "transcript", "redaction", "claude-code", "codex", "function-calling"]

[project.scripts]
agentshare = "agentshare.__main__:main"

[project.urls]
Repository = "https://github.com/fuxing0910-hue/agentshare"
Issues = "https://github.com/fuxing0910-hue/agentshare/issues"

[tool.setuptools.packages.find]
include = ["agentshare*"]

[tool.setuptools.package-data]
agentshare = ["templates/*.html"]
